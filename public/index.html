<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mistboard</title><link rel="stylesheet" href="/styles.css"></head><body><main><header><div><p class="eyebrow">Shared online tabletop</p><h1>Mistboard</h1></div><div class="status"><span id="status-dot"></span><span id="status">Connecting…</span></div></header><section class="tabletop" aria-label="Game board"><div class="board-label">THE GREYWARD</div><div id="board" class="board"></div><nav class="board-tools" aria-label="Board navigation"><button id="zoom-out" aria-label="Zoom out">−</button><output id="zoom-label">100%</output><button id="zoom-in" aria-label="Zoom in">+</button><button id="reset-view">Reset view</button></nav><aside><p>Room</p><strong id="room">—</strong><button id="copy-link">Copy invite link</button><small id="players">Just you</small><small id="selected-model">No model selected</small></aside></section><footer><span>Scroll to zoom. Drag empty space to pan.</span><span>Drag a model to move it.</span></footer></main><script type="module" src="/app.js"></script></body></html>
